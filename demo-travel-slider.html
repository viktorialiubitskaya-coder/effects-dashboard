<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Travel Slider · Calabria · Digital Evolution Italy</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sans:'Montserrat',system-ui,sans-serif;
  --body:'Barlow','Courier New',sans-serif;
  --mono:'Courier New',monospace;
  --gold:#c9a961;
  --t:.75s;--ease:cubic-bezier(0.76,0,0.24,1);
}
html,body{height:100%;overflow:hidden;background:#0a0a0a}

/* BG */
.bg-layer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center}
#bgB{opacity:0;transition:opacity 1s ease}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    linear-gradient(105deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.52) 38%,rgba(0,0,0,.12) 65%,rgba(0,0,0,.04) 100%),
    linear-gradient(to top,rgba(0,0,0,.45) 0%,transparent 45%);
}

/* NAV */
.topnav{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:1.2rem 2.2rem;display:flex;align-items:center;justify-content:space-between;
}
.logo-a{font-family:var(--mono);font-size:.52rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.logo-b{font-family:var(--mono);font-size:.36rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.38)}
.badge-demo{
  font-family:var(--mono);font-size:.36rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.1);
  padding:.2rem .45rem;background:rgba(0,0,0,.3);backdrop-filter:blur(8px);border-radius:2px;
}
.badge-demo em{color:rgba(255,255,255,.5);font-style:normal}

/* MAIN LAYOUT */
.hero{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:flex-end;
  padding:0 0 4.5rem 4vw;
  gap:3vw;
}

/* ── LEFT TEXT ─────────────────────────────── */
.text-side{flex:0 0 min(440px,38vw);display:flex;flex-direction:column;gap:1.2rem}

.pre-tag{display:flex;align-items:center;gap:.7rem;overflow:hidden;height:1.3em}
.pre-line{width:28px;height:2px;background:var(--gold);flex-shrink:0}
.pre-tag span{
  display:block;font-family:var(--mono);font-size:.42rem;letter-spacing:.28em;
  text-transform:uppercase;color:rgba(255,255,255,.6);
  transition:transform var(--t) var(--ease),opacity .4s;
}

.title{
  font-family:var(--sans);font-weight:900;font-style:normal;
  font-size:clamp(3.2rem,6.5vw,6.2rem);line-height:.88;
  letter-spacing:-.025em;color:#fff;
  display:flex;flex-direction:column;gap:.08em;
}
.tw{overflow:hidden;height:1.05em;display:block}
.tw span{display:inline-block;transition:transform var(--t) var(--ease),opacity .4s}

.desc{
  font-family:var(--body);font-size:.72rem;font-weight:400;letter-spacing:.01em;
  color:rgba(255,255,255,.62);line-height:1.75;max-width:340px;overflow:hidden;
}
.desc span{display:block;transition:transform var(--t) var(--ease),opacity .5s}

.cta-btn{
  display:inline-flex;align-items:center;gap:.7rem;cursor:pointer;
  font-family:var(--mono);font-size:.42rem;letter-spacing:.2em;text-transform:uppercase;
  color:#fff;padding:.55rem 1.4rem;
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  transition:background .25s,border-color .3s,transform .3s,letter-spacing .3s;
  width:fit-content;
}
.cta-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.65);transform:translateX(6px)}
.cta-arrow{font-size:.75rem;transition:transform .3s}
.cta-btn:hover .cta-arrow{transform:translateX(5px)}

/* ── RIGHT CARDS + NAV ────────────────────── */
.cards-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.1rem;align-items:flex-end}

/* clip to 3 cards: 3×140 + 2×10 = 440px */
.cards-row-wrap{overflow:hidden;width:440px}
.cards-row{
  display:flex;align-items:flex-end;gap:10px;
  transition:transform .65s var(--ease);
}

/* portrait card */
.card{
  flex:0 0 140px;height:192px;border-radius:10px;overflow:hidden;cursor:pointer;
  position:relative;
  transition:transform .45s var(--ease),filter .45s ease,opacity .45s ease,box-shadow .45s ease,flex-basis .45s var(--ease);
  filter:saturate(0.28) brightness(0.5);opacity:.6;
}
.card img{width:100%;height:62%;object-fit:cover;display:block;pointer-events:none}
.card-body{
  height:38%;background:#0f0f1a;
  padding:.45rem .6rem .4rem;
  display:flex;flex-direction:column;justify-content:space-between;
}
.card-accent{display:block;width:18px;height:2px;background:var(--gold);margin-bottom:.3rem}
.card-region{
  font-family:var(--mono);font-size:.3rem;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.45);line-height:1.3;
}
.card-name{
  font-family:var(--sans);font-weight:900;font-size:.92rem;
  line-height:1.05;color:#fff;letter-spacing:-.01em;
}
/* active state */
.card.active{
  filter:saturate(1) brightness(1.04);opacity:1;
  transform:scale(1.05) translateY(-8px);
  box-shadow:0 18px 40px rgba(0,0,0,.6);
}
.card.active .card-body{background:#16162a}
.card:hover:not(.active){filter:saturate(0.5) brightness(0.72);opacity:.82;transform:translateY(-3px)}

/* NAV ROW */
.nav-row{display:flex;align-items:center;gap:12px;padding-left:2px;width:440px}
.nav-btn{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.nav-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5)}
.progress-track{flex:1;height:2px;background:rgba(255,255,255,.15);border-radius:1px;position:relative;cursor:pointer}
.progress-fill{height:100%;background:var(--gold);border-radius:1px;transition:width .7s var(--ease)}
.nav-count{
  font-family:var(--mono);font-size:.44rem;letter-spacing:.1em;
  color:rgba(255,255,255,.45);flex-shrink:0;
}
</style>
</head>
<body>

<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<div class="overlay"></div>

<nav class="topnav">
  <div>
    <p class="logo-a">Digital Evolution</p>
    <p class="logo-b">Italy · Travel Slider</p>
  </div>
  <div class="badge-demo">Effetto: <em>Travel Slider</em> · Digital Evolution Italy</div>
</nav>

<div class="hero">
  <!-- TEXT LEFT -->
  <div class="text-side">
    <div class="pre-tag">
      <div class="pre-line"></div>
      <span id="tagSpan">Tropea · Vibo Valentia</span>
    </div>
    <h1 class="title" id="titleEl"></h1>
    <div class="desc"><span id="descSpan"></span></div>
    <button class="cta-btn">SCOPRI IL TOUR <span class="cta-arrow">→</span></button>
  </div>

  <!-- CARDS + NAV RIGHT -->
  <div class="cards-side">
    <div class="cards-row-wrap"><div class="cards-row" id="cardsRow"></div></div>
    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">←</button>
      <button class="nav-btn" id="nextBtn">→</button>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill" style="width:16.67%"></div>
      </div>
      <span class="nav-count" id="navCount">01 / 06</span>
    </div>
  </div>
</div>

<script>
const SLIDES = [
  { tag:'Tropea · Vibo Valentia',    region:'Vibo Valentia',  title:'Tropea',        desc:"La perla del Tirreno. Scogliere dorate, mare cristallino e il tramonto più famoso della Calabria.", img:'img/travel/t-1.jpg' },
  { tag:'Scilla · Reggio Calabria',  region:'Reggio Calabria',title:'Scilla',        desc:"Tra Scilla e Cariddi. Il borgo antico affacciato sullo Stretto, dove miti e Mediterraneo si incontrano.", img:'img/travel/t-2.jpg' },
  { tag:'Le Castella · Crotone',     region:'Crotone',        title:'Le Castella',   desc:"Aragonese nel mare. La fortezza medievale emerge dall'acqua turchese dello Ionio come un castello dei sogni.", img:'img/travel/t-3.jpg' },
  { tag:'Parco della Sila · Cosenza',region:'Cosenza',        title:'Sila',          desc:"Il polmone verde della Calabria. Foreste di pini millenari, laghi alpini e silenzi che rigenerano l'anima.", img:'img/travel/t-4.jpg' },
  { tag:'Capo Vaticano · Vibo Val.', region:'Vibo Valentia',  title:'Capo Vaticano', desc:"Lo sperone d'Italia. Scogliere a picco, fondali trasparenti e il profumo della macchia mediterranea.", img:'img/travel/t-5.jpg' },
  { tag:'Gerace · Reggio Calabria',  region:'Reggio Calabria',title:'Gerace',        desc:"Città sospesa nel tempo. Il borgo medievale custodisce una cattedrale normanna e panorami senza confini.", img:'img/travel/t-6.jpg' },
]

const N = SLIDES.length
let cur = 0, busy = false

const bgA    = document.getElementById('bgA')
const bgB    = document.getElementById('bgB')
const tagSpan= document.getElementById('tagSpan')
const titleEl= document.getElementById('titleEl')
const descSpan=document.getElementById('descSpan')
const cardsRow=document.getElementById('cardsRow')
const progressFill=document.getElementById('progressFill')
const navCount=document.getElementById('navCount')

const CARD_W = 140, CARD_GAP = 10

function updateRow(idx) {
  // clamp window: active card always at position 1 of 3 (center), clamped at edges
  const first = Math.max(0, Math.min(idx - 1, N - 3))
  cardsRow.style.transform = `translateX(-${first * (CARD_W + CARD_GAP)}px)`
}

// Build portrait cards
SLIDES.forEach((s,i) => {
  const c = document.createElement('div')
  c.className = 'card' + (i===0?' active':'')
  c.innerHTML = `
    <img src="${s.img}" loading="eager" alt=""/>
    <div class="card-body">
      <div>
        <span class="card-accent"></span>
        <p class="card-region">${s.region}</p>
      </div>
      <p class="card-name">${s.title}</p>
    </div>`
  c.addEventListener('click', () => goTo(i))
  cardsRow.appendChild(c)
})
const cardEls = [...cardsRow.querySelectorAll('.card')]

document.getElementById('prevBtn').addEventListener('click', () => goTo(cur-1))
document.getElementById('nextBtn').addEventListener('click', () => goTo(cur+1))

// BG crossfade
let fadeTimer = null
function crossfadeBg(src) {
  if (fadeTimer) clearTimeout(fadeTimer)
  bgB.style.backgroundImage = `url(${src})`
  bgB.offsetHeight
  bgB.style.opacity = '1'
  fadeTimer = setTimeout(() => {
    bgA.style.backgroundImage = `url(${src})`
    bgB.style.transition = 'none'
    bgB.style.opacity = '0'
    bgB.offsetHeight
    bgB.style.transition = 'opacity 1s ease'
  }, 1100)
}

// Title per-char animation
function buildTitle(text, dir) {
  titleEl.innerHTML = ''
  text.split(' ').forEach(word => {
    const w = document.createElement('span')
    w.className = 'tw'
    ;[...word].forEach(ch => {
      const s = document.createElement('span')
      s.textContent = ch
      s.style.cssText = `transform:translateY(${dir==='next'?'105%':'-105%'});opacity:0`
      w.appendChild(s)
    })
    titleEl.appendChild(w)
  })
  titleEl.querySelectorAll('.tw span').forEach((s,i) =>
    setTimeout(() => { s.style.transform='translateY(0)'; s.style.opacity='1' }, i*36+65))
}
function exitTitle(dir) {
  titleEl.querySelectorAll('.tw span').forEach((s,i) =>
    setTimeout(() => {
      s.style.transform=`translateY(${dir==='next'?'-105%':'105%'})`
      s.style.opacity='0'
    }, i*20))
}

function slideEl(el, val, dir, delay) {
  el.style.transform=`translateY(${dir==='next'?'-100%':'100%'})`; el.style.opacity='0'
  setTimeout(() => {
    el.textContent=val; el.style.transition='none'
    el.style.transform=`translateY(${dir==='next'?'100%':'-100%'})`; el.style.opacity='0'
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transition=''; el.style.transform='translateY(0)'; el.style.opacity='1'
    }))
  }, 210+delay)
}

function goTo(idx) {
  idx = ((idx%N)+N)%N
  if (busy || idx===cur) return
  busy = true
  const dir = idx > cur ? 'next' : 'prev'
  const s = SLIDES[idx]

  crossfadeBg(s.img)
  exitTitle(dir)
  slideEl(tagSpan,  s.tag,  dir, 0)
  slideEl(descSpan, s.desc, dir, 40)

  cardEls.forEach((c,i) => c.classList.toggle('active', i===idx))
  updateRow(idx)
  progressFill.style.width = `${(idx+1)/N*100}%`
  navCount.textContent = `0${idx+1} / 0${N}`

  setTimeout(() => {
    buildTitle(s.title, dir)
    cur = idx
    busy = false
  }, 210)
}

// Init
bgA.style.backgroundImage = `url(${SLIDES[0].img})`
tagSpan.textContent  = SLIDES[0].tag
descSpan.textContent = SLIDES[0].desc
buildTitle(SLIDES[0].title, 'next')
updateRow(0)
SLIDES.forEach(s => { const img = new Image(); img.src = s.img })

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key==='ArrowRight'||e.key==='ArrowDown') goTo(cur+1)
  if (e.key==='ArrowLeft' ||e.key==='ArrowUp')   goTo(cur-1)
})

// Wheel
let wLock = false
document.addEventListener('wheel', e => {
  if (wLock) return; if(Math.abs(e.deltaY)<20) return
  wLock=true; goTo(e.deltaY>0?cur+1:cur-1)
  setTimeout(()=>{wLock=false},950)
},{passive:true})

// Touch
let tx=0,ty=0
document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true})
document.addEventListener('touchend',e=>{
  const dx=tx-e.changedTouches[0].clientX, dy=ty-e.changedTouches[0].clientY
  if(Math.abs(dx)>Math.abs(dy)){if(Math.abs(dx)>40)goTo(dx>0?cur+1:cur-1)}
  else{if(Math.abs(dy)>40)goTo(dy>0?cur+1:cur-1)}
},{passive:true})
</script>
</body>
</html>

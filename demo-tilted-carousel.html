<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tilted Carousel · Bar · Digital Evolution Italy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--t:.7s;--spring:cubic-bezier(0.34,1.3,0.64,1)}
html,body{height:100%;overflow:hidden;background:#F0EBE3;font-family:'Inter',sans-serif}

/* Header */
.header{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding:1.5rem 3rem;
  display:flex;justify-content:space-between;align-items:center;
}
.logo{font-size:.44rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(0,0,0,.38)}
.logo span{color:rgba(0,0,0,.7);font-weight:500}
.header-num{font-size:.44rem;letter-spacing:.12em;color:rgba(0,0,0,.3)}

/* Scene */
.scene{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
}

/* Stage */
.stage{
  position:relative;
  width:100%;height:380px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:visible;
}

.card{
  position:absolute;
  width:200px;height:300px;
  border-radius:14px;overflow:hidden;
  cursor:pointer;
  transition:transform var(--t) var(--spring), opacity var(--t) ease, box-shadow var(--t) ease;
  will-change:transform,opacity;
  transform-origin:center bottom;
}
.card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.card.is-active{box-shadow:0 24px 60px rgba(0,0,0,.22)}
.card:not(.is-active){box-shadow:0 6px 20px rgba(0,0,0,.1)}

/* Bottom UI */
.bottom{
  display:flex;flex-direction:column;align-items:center;
  gap:1.2rem;margin-top:2rem;
  z-index:10;
}

/* Active label */
.label-wrap{height:2.6rem;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.label{
  text-align:center;
  transform:translateY(0);opacity:1;
  transition:transform .35s ease,opacity .3s;
}
.label.exit{transform:translateY(-100%);opacity:0}
.label-tag{font-size:.38rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(0,0,0,.38);margin-bottom:.2rem}
.label-name{font-family:'Playfair Display',serif;font-size:1.2rem;color:rgba(0,0,0,.78);font-style:italic}

/* Nav */
.nav{display:flex;align-items:center;gap:1.2rem}
.nav-btn{
  width:36px;height:36px;border-radius:50%;
  border:1px solid rgba(0,0,0,.18);background:rgba(255,255,255,.7);
  color:rgba(0,0,0,.5);font-size:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s,transform .15s;
  backdrop-filter:blur(6px);
}
.nav-btn:hover{background:#fff;border-color:rgba(0,0,0,.35);transform:scale(1.1)}
.nav-btn:active{transform:scale(.92)}

.dots{display:flex;gap:5px;align-items:center}
.dot{
  width:4px;height:4px;border-radius:50%;
  background:rgba(0,0,0,.18);cursor:pointer;
  transition:width .35s,border-radius .35s,background .35s;
}
.dot.active{width:22px;border-radius:2px;background:rgba(0,0,0,.6)}
.dot:hover:not(.active){background:rgba(0,0,0,.35)}

/* Footer */
.footer-tag{
  position:fixed;bottom:1rem;right:1.5rem;z-index:20;
  font-size:.36rem;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(0,0,0,.28);border:1px solid rgba(0,0,0,.1);
  padding:.2rem .44rem;border-radius:2px;
}
.footer-tag em{color:rgba(0,0,0,.45);font-style:normal}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span>Elixir</span> Bar & Lounge · Calabria</div>
  <div class="header-num" id="headerNum">01 / 08</div>
</div>

<div class="scene">
  <div class="stage" id="stage"></div>

  <div class="bottom">
    <div class="label-wrap">
      <div class="label" id="labelEl">
        <div class="label-tag" id="labelTag">Aperitivo</div>
        <div class="label-name" id="labelName">Il Barman</div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn" id="prevBtn">←</button>
      <div class="dots" id="dotsEl"></div>
      <button class="nav-btn" id="nextBtn">→</button>
    </div>
  </div>
</div>

<div class="footer-tag">Effetto: <em>Tilted Carousel</em> · Bar & Lounge · Digital Evolution Italy</div>

<script>
const SLIDES = [
  { img:'img/bar/b-1.jpg', tag:'Aperitivo',    name:'Il Barman' },
  { img:'img/bar/b-2.jpg', tag:'Signature',     name:'Negroni' },
  { img:'img/bar/b-3.jpg', tag:'Ambiente',      name:'Il Lounge' },
  { img:'img/bar/b-4.jpg', tag:'Terrazza',      name:'Aperol Sunset' },
  { img:'img/bar/b-5.jpg', tag:'Selezione',     name:'La Cantina' },
  { img:'img/bar/b-6.jpg', tag:'Stagionale',    name:'Frutta & Erbe' },
  { img:'img/bar/b-7.jpg', tag:'Serata',        name:'Serata Speciale' },
  { img:'img/bar/b-8.jpg', tag:'Signature',     name:'Smoking Cocktail' },
]

// Layout params
const STEP_X    = 158   // px between card centers
const TILT      = 14    // degrees per step
const SCALE_DEC = 0.165 // scale reduction per step
const MIN_SCALE = 0.42
const FADE_AT   = 3     // abs distance where opacity = 0

const N   = SLIDES.length
let cur   = 0, busy = false
let dragStartX = null, dragDelta = 0

const stage   = document.getElementById('stage')
const dotsEl  = document.getElementById('dotsEl')
const labelEl = document.getElementById('labelEl')
const labelTag= document.getElementById('labelTag')
const labelName=document.getElementById('labelName')
const headerNum=document.getElementById('headerNum')

// Build cards
SLIDES.forEach((s, i) => {
  const c = document.createElement('div')
  c.className = 'card'
  c.innerHTML = `<img src="${s.img}" loading="eager" alt="${s.name}"/>`
  c.addEventListener('click', () => goTo(i))
  stage.appendChild(c)
})
const cards = [...stage.querySelectorAll('.card')]

// Build dots
SLIDES.forEach((_, i) => {
  const d = document.createElement('div')
  d.className = 'dot'
  d.addEventListener('click', () => goTo(i))
  dotsEl.appendChild(d)
})
const dotEls = [...dotsEl.querySelectorAll('.dot')]

function positionCards(ai) {
  cards.forEach((c, i) => {
    const d    = i - ai
    const absD = Math.abs(d)
    const x     = d * STEP_X
    const rot   = d * TILT
    const scale = Math.max(MIN_SCALE, 1 - absD * SCALE_DEC)
    const opacity = absD >= FADE_AT ? 0 : absD === FADE_AT - 1 ? 0.28 : absD === 2 ? 0.55 : absD === 1 ? 0.8 : 1
    const z     = N - absD

    c.style.transform = `translateX(${x}px) rotate(${rot}deg) scale(${scale})`
    c.style.opacity   = opacity
    c.style.zIndex    = z
    c.classList.toggle('is-active', i === ai)
  })
  dotEls.forEach((d, i) => d.classList.toggle('active', i === ai))
  headerNum.textContent = String(ai + 1).padStart(2, '0') + ' / ' + String(N).padStart(2, '0')
}

function updateLabel(ai, dir) {
  // exit current
  labelEl.classList.add('exit')
  setTimeout(() => {
    labelTag.textContent  = SLIDES[ai].tag
    labelName.textContent = SLIDES[ai].name
    labelEl.style.transition = 'none'
    labelEl.style.transform  = `translateY(${dir === 'next' ? '100%' : '-100%'})`
    labelEl.style.opacity    = '0'
    labelEl.classList.remove('exit')
    requestAnimationFrame(() => requestAnimationFrame(() => {
      labelEl.style.transition = ''
      labelEl.style.transform  = 'translateY(0)'
      labelEl.style.opacity    = '1'
    }))
  }, 200)
}

function goTo(idx) {
  idx = ((idx % N) + N) % N
  if (busy || idx === cur) return
  busy = true
  const dir = idx > cur ? 'next' : 'prev'
  cur = idx
  positionCards(cur)
  updateLabel(cur, dir)
  setTimeout(() => { busy = false }, 750)
}

// Init — cards appear from center
cards.forEach(c => { c.style.transition = 'none'; c.style.opacity = '0'; c.style.transform = 'translateX(0) rotate(0deg) scale(.7)' })
requestAnimationFrame(() => requestAnimationFrame(() => {
  cards.forEach(c => { c.style.transition = '' })
  positionCards(0)
}))
SLIDES.forEach(s => { const img = new Image(); img.src = s.img })

document.getElementById('prevBtn').addEventListener('click', () => goTo(cur - 1))
document.getElementById('nextBtn').addEventListener('click', () => goTo(cur + 1))

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  goTo(cur - 1)
  if (e.key === 'ArrowRight') goTo(cur + 1)
})

let wLock = false
document.addEventListener('wheel', e => {
  if (wLock || Math.abs(e.deltaX || e.deltaY) < 20) return
  wLock = true
  goTo((e.deltaX || e.deltaY) > 0 ? cur + 1 : cur - 1)
  setTimeout(() => { wLock = false }, 780)
},{passive:true})

// Drag
stage.addEventListener('mousedown', e => { dragStartX = e.clientX; dragDelta = 0 })
document.addEventListener('mousemove', e => {
  if (dragStartX === null) return
  dragDelta = e.clientX - dragStartX
  const tentative = cur - dragDelta / STEP_X
  cards.forEach((c, i) => {
    const d = i - tentative
    const absD = Math.abs(d)
    const x = d * STEP_X
    const rot = d * TILT
    const scale = Math.max(MIN_SCALE, 1 - absD * SCALE_DEC)
    c.style.transition = 'none'
    c.style.transform = `translateX(${x}px) rotate(${rot}deg) scale(${scale})`
  })
})
document.addEventListener('mouseup', () => {
  if (dragStartX === null) return
  cards.forEach(c => { c.style.transition = '' })
  if (Math.abs(dragDelta) > 50) goTo(dragDelta < 0 ? cur + 1 : cur - 1)
  else positionCards(cur)
  dragStartX = null; dragDelta = 0
})

let tx = 0
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX },{passive:true})
document.addEventListener('touchend', e => {
  const dx = tx - e.changedTouches[0].clientX
  if (Math.abs(dx) > 50) goTo(dx > 0 ? cur + 1 : cur - 1)
},{passive:true})
</script>
</body>
</html>

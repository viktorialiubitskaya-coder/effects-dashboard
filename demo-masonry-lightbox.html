<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masonry Gallery + Lightbox — Demo · Digital Evolution Italy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --notte:      #0a1929;
    --notte-deep: #050d18;
    --marmo:      #f5f1e8;
    --oro:        #c9a961;
    --oro-chiaro: #e8d4a0;
    --ease:       cubic-bezier(0.16, 1, 0.3, 1);
  }

  body {
    background: var(--notte-deep);
    color: var(--marmo);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    overflow-x: hidden;
    padding: 3.5rem 1.25rem 5rem;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    max-width: 40rem;
    margin: 0 auto 3rem;
    opacity: 0;
    transform: translateY(16px);
    animation: fade-up 0.9s var(--ease) 0.1s forwards;
  }
  .eyebrow {
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--oro);
    margin-bottom: 1rem;
  }
  .title {
    font-size: clamp(2rem, 5vw, 3.6rem);
    font-weight: 300;
    line-height: 1.05;
    color: var(--marmo);
    margin-bottom: 0.85rem;
  }
  .subtitle {
    font-size: 0.95rem;
    color: rgba(245,241,232,0.5);
    font-family: 'Arial', sans-serif;
    font-weight: 300;
    line-height: 1.6;
  }

  @keyframes fade-up {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── Masonry grid (CSS columns) ── */
  .masonry {
    max-width: 1180px;
    margin: 0 auto;
    column-count: 4;
    column-gap: 1rem;
  }
  @media (max-width: 1100px) { .masonry { column-count: 3; } }
  @media (max-width: 760px)  { .masonry { column-count: 2; } }
  @media (max-width: 460px)  { .masonry { column-count: 1; } }

  .tile {
    position: relative;
    display: block;
    width: 100%;
    margin-bottom: 1rem;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    background: var(--notte);
    border: 1px solid rgba(201,169,97,0.12);
    /* reveal initial state via class (JS-driven, content safe if JS fails) */
    transform: translateY(24px);
    opacity: 0.001;
    transition: transform 0.7s var(--ease), opacity 0.7s var(--ease),
                border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
    break-inside: avoid;
  }
  .tile.visible { transform: translateY(0); opacity: 1; }

  .tile img {
    display: block;
    width: 100%;
    height: auto;
    transition: transform 0.6s var(--ease), filter 0.6s var(--ease);
    filter: brightness(0.92) saturate(0.95);
  }
  .tile:hover {
    border-color: rgba(201,169,97,0.55);
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  .tile:hover img { transform: scale(1.06); filter: brightness(1) saturate(1.05); }

  /* gold corner accent + zoom hint on hover */
  .tile::after {
    content: '⤢';
    position: absolute;
    top: 0.6rem; right: 0.7rem;
    width: 2rem; height: 2rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem;
    color: var(--notte-deep);
    background: var(--oro);
    border-radius: 50%;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
    pointer-events: none;
  }
  .tile:hover::after { opacity: 1; transform: scale(1); }

  .tile-cap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 1.4rem 0.9rem 0.7rem;
    font-family: 'Courier New', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--marmo);
    background: linear-gradient(to top, rgba(5,13,24,0.85), transparent);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
    pointer-events: none;
  }
  .tile:hover .tile-cap { opacity: 1; transform: translateY(0); }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    background: rgba(5,13,24,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s var(--ease), visibility 0.4s;
  }
  .lightbox.open { opacity: 1; visibility: visible; }

  .lb-stage {
    position: relative;
    max-width: min(1100px, 92vw);
    max-height: 82vh;
  }
  .lb-img {
    display: block;
    max-width: 100%;
    max-height: 82vh;
    border-radius: 10px;
    border: 1px solid rgba(201,169,97,0.3);
    box-shadow: 0 24px 70px rgba(0,0,0,0.65);
    transform: scale(0.94);
    transition: transform 0.45s var(--ease);
  }
  .lightbox.open .lb-img { transform: scale(1); }

  .lb-counter {
    position: absolute;
    top: -2.1rem; left: 0;
    font-family: 'Courier New', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--oro);
  }
  .lb-caption {
    position: absolute;
    bottom: -2.2rem; left: 0; right: 0;
    text-align: center;
    font-family: 'Arial', sans-serif;
    font-size: 0.8rem;
    color: rgba(245,241,232,0.6);
  }

  .lb-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 3.1rem; height: 3.1rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    color: var(--marmo);
    background: rgba(10,25,41,0.7);
    border: 1px solid rgba(201,169,97,0.3);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s var(--ease), border-color 0.3s var(--ease), transform 0.2s var(--ease);
  }
  .lb-btn:hover { background: var(--oro); color: var(--notte-deep); border-color: var(--oro); }
  .lb-btn:active { transform: translateY(-50%) scale(0.9); }
  .lb-prev { left: -4.6rem; }
  .lb-next { right: -4.6rem; }

  .lb-close {
    position: fixed;
    top: 1.4rem; right: 1.6rem;
    width: 2.8rem; height: 2.8rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 300;
    color: var(--marmo);
    background: rgba(10,25,41,0.7);
    border: 1px solid rgba(201,169,97,0.3);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.3s var(--ease), color 0.3s var(--ease);
  }
  .lb-close:hover { background: var(--oro); color: var(--notte-deep); }

  @media (max-width: 760px) {
    .lb-prev { left: 0.4rem; }
    .lb-next { right: 0.4rem; }
    .lb-btn { width: 2.6rem; height: 2.6rem; font-size: 1.1rem; background: rgba(10,25,41,0.85); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .tile { opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="eyebrow">Galleria · Masonry + Lightbox</div>
    <h1 class="title">Atmosfere del Ristorante</h1>
    <p class="subtitle">Griglia a mattoncini con altezze variabili. Clicca una foto per aprirla a tutto schermo — naviga con frecce, tastiera o swipe.</p>
  </header>

  <main class="masonry" id="grid"><!-- tiles injected by JS --></main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Chiudi">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Precedente">‹</button>
    <div class="lb-stage">
      <div class="lb-counter" id="lbCounter">01 / 12</div>
      <img class="lb-img" id="lbImg" src="" alt="" />
      <div class="lb-caption" id="lbCaption"></div>
    </div>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Successiva">›</button>
  </div>

<script>
  // ── Data ──────────────────────────────────────────────
  const PHOTOS = [
    { src: 'img/ristorante/r-1.jpg',  cap: 'Sala principale' },
    { src: 'img/ristorante/r-2.jpg',  cap: 'Dettaglio tavola' },
    { src: 'img/ristorante/r-3.jpg',  cap: 'Cucina a vista' },
    { src: 'img/ristorante/r-4.jpg',  cap: 'Cantina vini' },
    { src: 'img/ristorante/r-5.jpg',  cap: 'Terrazza serale' },
    { src: 'img/ristorante/r-6.jpg',  cap: 'Piatto signature' },
    { src: 'img/ristorante/r-7.jpg',  cap: 'Bancone bar' },
    { src: 'img/ristorante/r-8.jpg',  cap: 'Atmosfera lume' },
    { src: 'img/ristorante/r-9.jpg',  cap: 'Sala privé' },
    { src: 'img/ristorante/r-10.jpg', cap: 'Mise en place' },
    { src: 'img/ristorante/r-11.jpg', cap: 'Dessert dello chef' },
    { src: 'img/ristorante/r-12.jpg', cap: 'Ingresso' },
  ];

  // ── Build grid ────────────────────────────────────────
  const grid = document.getElementById('grid');
  PHOTOS.forEach((p, i) => {
    const tile = document.createElement('figure');
    tile.className = 'tile';
    tile.dataset.index = i;
    tile.innerHTML =
      `<img src="${p.src}" alt="${p.cap}" loading="lazy" />` +
      `<figcaption class="tile-cap">${String(i + 1).padStart(2, '0')} · ${p.cap}</figcaption>`;
    tile.addEventListener('click', () => openLightbox(i));
    grid.appendChild(tile);
  });

  // ── Stagger reveal (single observer) ──────────────────
  const tiles = grid.querySelectorAll('.tile');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        const idx = +e.target.dataset.index;
        e.target.style.transitionDelay = (idx % 4) * 0.08 + 's';
        e.target.classList.add('visible');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  tiles.forEach((t) => obs.observe(t));

  // ── Lightbox logic ────────────────────────────────────
  const lb       = document.getElementById('lightbox');
  const lbImg    = document.getElementById('lbImg');
  const lbCap    = document.getElementById('lbCaption');
  const lbCount  = document.getElementById('lbCounter');
  let current = 0;

  function show(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    const p = PHOTOS[current];
    lbImg.src = p.src;
    lbImg.alt = p.cap;
    lbCap.textContent = p.cap;
    lbCount.textContent = String(current + 1).padStart(2, '0') + ' / ' + String(PHOTOS.length).padStart(2, '0');
  }
  function openLightbox(i) {
    show(i);
    lb.classList.add('open');
    lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });

  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });

  // touch swipe
  let touchX = null;
  lb.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', (e) => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    touchX = null;
  }, { passive: true });
</script>
</body>
</html>

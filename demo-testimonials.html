<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Testimonianze · Digital Evolution Italy</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#050d18; --surface:#0a1929;
    --border:rgba(201,169,97,0.13);
    --oro:#c9a961; --oro-dim:rgba(201,169,97,0.35);
    --text:#f5f1e8; --dim:rgba(245,241,232,0.45); --muted:rgba(245,241,232,0.2);
    --serif:Georgia,'Times New Roman',serif; --mono:'Courier New',monospace;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  html, body { height:100%; background:var(--bg); color:var(--text); font-family:var(--mono); overflow:hidden; }

  /* Aurora */
  .aurora { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .ab { position:absolute; border-radius:50%; filter:blur(90px); opacity:0.065; }
  .ab-1 { width:800px; height:500px; top:-100px; left:-200px;
    background:radial-gradient(ellipse,rgba(26,80,200,1) 0%,transparent 65%);
    animation:ab1 48s ease-in-out infinite alternate; }
  .ab-2 { width:600px; height:600px; top:20%; right:-150px;
    background:radial-gradient(ellipse,rgba(160,100,10,1) 0%,transparent 65%);
    animation:ab2 60s ease-in-out infinite alternate; animation-delay:-20s; }
  .ab-3 { width:700px; height:400px; bottom:-80px; left:20%;
    background:radial-gradient(ellipse,rgba(80,20,140,1) 0%,transparent 65%);
    animation:ab3 42s ease-in-out infinite alternate; animation-delay:-10s; }
  @keyframes ab1 { from{transform:translate(0,0)}    to{transform:translate(100px,60px)} }
  @keyframes ab2 { from{transform:translate(0,0)}    to{transform:translate(-80px,80px)} }
  @keyframes ab3 { from{transform:translate(0,0)}    to{transform:translate(60px,-70px)} }

  body::before {
    content:''; position:fixed; inset:0;
    background-image:radial-gradient(circle,rgba(201,169,97,0.04) 1px,transparent 1px);
    background-size:42px 42px; pointer-events:none; z-index:0;
  }

  /* Layout */
  .page {
    position:relative; z-index:1; height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0 max(2rem,8vw);
  }

  /* Header */
  .header { text-align:center; margin-bottom:3.5rem; }
  .header-pre { font-size:0.5rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--oro); margin-bottom:0.6rem; }
  .header-title { font-family:var(--serif); font-size:clamp(1.6rem,3vw,2.4rem); font-weight:300; }

  /* Stage */
  .stage {
    width:100%; max-width:760px; position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2.5rem;
  }

  /* Giant quote mark */
  .quote-mark {
    position:absolute; top:-2rem; left:-1rem;
    font-family:var(--serif); font-size:12rem; line-height:1; color:rgba(201,169,97,0.06);
    pointer-events:none; user-select:none; font-weight:700;
    z-index:0;
  }

  /* Quote text area */
  .quote-wrap { position:relative; z-index:1; width:100%; min-height:140px; display:flex; align-items:center; justify-content:center; }
  .quote-slide {
    position:absolute; width:100%; text-align:center;
    font-family:var(--serif); font-size:clamp(1.1rem,2.2vw,1.55rem);
    font-weight:300; line-height:1.6; color:var(--text);
    opacity:0; transform:translateY(20px);
    transition:opacity 0.55s var(--ease), transform 0.55s var(--ease);
    pointer-events:none;
  }
  .quote-slide.active {
    opacity:1; transform:translateY(0); pointer-events:auto;
  }
  .quote-slide.exit {
    opacity:0; transform:translateY(-18px);
  }

  /* Stars */
  .stars { display:flex; gap:0.3rem; z-index:1; }
  .star { font-size:0.85rem; color:var(--oro); transition:transform 0.3s; }
  .star:hover { transform:scale(1.3); }

  /* Author area */
  .author-wrap { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:1rem; }
  .author-slide {
    position:absolute; display:flex; align-items:center; gap:1rem;
    opacity:0; transform:translateY(12px);
    transition:opacity 0.5s 0.1s var(--ease), transform 0.5s 0.1s var(--ease);
  }
  .author-slide.active { position:relative; opacity:1; transform:none; }
  .author-slide.exit   { position:absolute; opacity:0; transform:translateY(-10px); }

  .avatar {
    width:44px; height:44px; border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--serif); font-size:1rem; font-weight:300;
    color:var(--oro); flex-shrink:0;
  }
  .author-info { display:flex; flex-direction:column; gap:0.15rem; }
  .author-name { font-size:0.62rem; letter-spacing:0.1em; color:var(--text); }
  .author-co   { font-size:0.52rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); }
  .author-result { font-size:0.52rem; letter-spacing:0.08em; color:var(--oro); }

  /* Divider */
  .author-divider { width:1px; height:2rem; background:var(--border); }

  /* Navigation dots */
  .dots { display:flex; gap:0.55rem; align-items:center; z-index:1; }
  .dot {
    width:5px; height:5px; border-radius:50%; background:var(--muted);
    cursor:pointer; transition:all 0.35s var(--ease); border:none;
  }
  .dot.active { background:var(--oro); width:18px; border-radius:3px; }
  .dot:hover:not(.active) { background:var(--dim); }

  /* Arrow buttons */
  .arrows { position:absolute; top:50%; transform:translateY(-50%); width:calc(100% + 6rem); left:-3rem; display:flex; justify-content:space-between; pointer-events:none; z-index:2; }
  .arrow {
    width:44px; height:44px; border:1px solid var(--border);
    background:rgba(10,25,41,0.6); backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:0.9rem; cursor:pointer; pointer-events:auto;
    transition:all 0.22s;
  }
  .arrow:hover { border-color:var(--oro-dim); color:var(--oro); background:rgba(201,169,97,0.06); }

  /* Progress bar */
  .progress-bar {
    position:absolute; bottom:0; left:0; height:1px;
    background:var(--oro); width:0%;
    transition:none;
  }
  .arrow-wrap { position:relative; }

  /* Nav */
  .nav { position:fixed; top:0; left:0; right:0; z-index:50; padding:1.25rem 2.5rem; display:flex; justify-content:space-between; background:linear-gradient(to bottom,rgba(5,13,24,0.85),transparent); pointer-events:none; }
  .logo { display:flex; flex-direction:column; }
  .logo-a { font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--text); }
  .logo-b { font-size:0.44rem; letter-spacing:0.26em; text-transform:uppercase; color:var(--oro); }
  .tag { position:fixed; bottom:1.5rem; right:1.5rem; z-index:50; font-size:0.44rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--dim); border:1px solid var(--border); padding:0.28rem 0.55rem; background:rgba(10,25,41,0.8); backdrop-filter:blur(8px); }
  .tag span { color:var(--oro); }
</style>
</head>
<body>

<div class="aurora">
  <div class="ab ab-1"></div>
  <div class="ab ab-2"></div>
  <div class="ab ab-3"></div>
</div>

<nav class="nav">
  <div class="logo"><span class="logo-a">Digital Evolution</span><span class="logo-b">Italy · Testimonianze</span></div>
</nav>

<div class="page">

  <div class="header">
    <p class="header-pre">Cosa dicono i clienti</p>
    <h1 class="header-title">Risultati che parlano<br>da soli.</h1>
  </div>

  <div class="stage" id="stage">

    <div class="quote-mark">"</div>

    <!-- Arrows -->
    <div class="arrows">
      <button class="arrow" id="btn-prev" onclick="go(-1)">←</button>
      <button class="arrow" id="btn-next" onclick="go(1)">→</button>
    </div>

    <!-- Quote slides -->
    <div class="quote-wrap" id="quote-wrap"></div>

    <!-- Stars -->
    <div class="stars">
      <span class="star">★</span><span class="star">★</span><span class="star">★</span>
      <span class="star">★</span><span class="star">★</span>
    </div>

    <!-- Author slides -->
    <div class="author-wrap" id="author-wrap"></div>

    <!-- Dots -->
    <div class="dots" id="dots"></div>

  </div>

</div>

<div class="tag">Effetto: <span>Testimonianze Animate</span> · Digital Evolution Italy</div>

<script>
const DATA = [
  {
    quote: "Il nostro hotel era praticamente invisibile online. In sei mesi Digital Evolution ha trasformato tutto: sito nuovo, Google ottimizzato, social attivi. Non torniamo più indietro.",
    name:  "Marco Ricci",
    co:    "Hotel Villa Mediterranea · Tropea",
    result:"+180% prenotazioni dirette",
    initial:"M",
  },
  {
    quote: "Avevamo paura che un sito professionale fosse fuori budget. Invece il ROI è arrivato nel primo mese. Adesso i tavoli si prenotano da soli, anche la domenica sera.",
    name:  "Sofia Marano",
    co:    "Ristorante Il Porto · Reggio Calabria",
    result:"+240% coperti prenotati online",
    initial:"S",
  },
  {
    quote: "Le foto degli immobili che producono adesso sono un altro pianeta. I clienti arrivano già convinti. Abbiamo ridotto i tempi di vendita della metà.",
    name:  "Alessandro Ferrari",
    co:    "Ferrari Immobiliare · Cosenza",
    result:"−50% tempo medio di vendita",
    initial:"A",
  },
  {
    quote: "La nostra spa esisteva da anni ma era come se non esistesse. Dopo tre mesi di lavoro insieme siamo diventati il centro benessere più cercato della provincia.",
    name:  "Giulia Romano",
    co:    "SPA Essenza · Catanzaro",
    result:"#1 su Google per 'spa Catanzaro'",
    initial:"G",
  },
  {
    quote: "I turisti stranieri non ci trovavano. Adesso il sito parla inglese, tedesco, russo. Le richieste di tour arrivano da tutto il mondo, anche fuori stagione.",
    name:  "Luca Martino",
    co:    "Calabria Tours · Soverato",
    result:"+400% richieste via web",
    initial:"L",
  },
  {
    quote: "Pensavo che i social fossero roba per i giovani. Mi hanno convinto a provare. In due mesi la mia pizzeria è diventata virale su Instagram e ora ho lista d'attesa ogni weekend.",
    name:  "Anna Conti",
    co:    "Pizzeria Da Anna · Scalea",
    result:"Lista d'attesa ogni weekend",
    initial:"A",
  },
]

const N = DATA.length
let cur = 0, prev = -1, timer, paused = false
const INTERVAL = 5000

// Build DOM
const qWrap = document.getElementById('quote-wrap')
const aWrap = document.getElementById('author-wrap')
const dotsEl = document.getElementById('dots')

DATA.forEach((d, i) => {
  // Quote
  const q = document.createElement('div')
  q.className = 'quote-slide' + (i===0?' active':'')
  q.id = `q-${i}`
  q.textContent = `"${d.quote}"`
  qWrap.appendChild(q)

  // Author
  const a = document.createElement('div')
  a.className = 'author-slide' + (i===0?' active':'')
  a.id = `a-${i}`
  a.innerHTML = `
    <div class="avatar">${d.initial}</div>
    <div class="author-divider"></div>
    <div class="author-info">
      <span class="author-name">${d.name}</span>
      <span class="author-co">${d.co}</span>
      <span class="author-result">${d.result}</span>
    </div>`
  aWrap.appendChild(a)

  // Dot
  const dot = document.createElement('button')
  dot.className = 'dot' + (i===0?' active':'')
  dot.onclick = () => goTo(i)
  dotsEl.appendChild(dot)
})

function goTo(next) {
  if(next === cur) return
  prev = cur; cur = next

  const qs = document.querySelectorAll('.quote-slide')
  const as = document.querySelectorAll('.author-slide')
  const ds = document.querySelectorAll('.dot')

  // Exit previous
  qs[prev].classList.remove('active'); qs[prev].classList.add('exit')
  as[prev].classList.remove('active'); as[prev].classList.add('exit')

  // Clean exit after transition
  setTimeout(() => {
    qs[prev].classList.remove('exit')
    as[prev].classList.remove('exit')
  }, 600)

  // Enter new
  requestAnimationFrame(() => {
    qs[cur].classList.add('active')
    as[cur].classList.add('active')
    ds.forEach((d,i) => d.classList.toggle('active', i===cur))
  })

  resetTimer()
}

function go(dir) { goTo((cur + dir + N) % N) }

// Auto-advance
function resetTimer() {
  clearInterval(timer)
  if(!paused) timer = setInterval(() => go(1), INTERVAL)
}

document.getElementById('stage').addEventListener('mouseenter', ()=>{ paused=true; clearInterval(timer) })
document.getElementById('stage').addEventListener('mouseleave', ()=>{ paused=false; resetTimer() })

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') go(1)
  if(e.key==='ArrowLeft')  go(-1)
})

// Touch swipe
let tx = 0
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX }, {passive:true})
document.addEventListener('touchend',   e => { const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>40) go(dx<0?1:-1) })

resetTimer()
</script>
</body>
</html>

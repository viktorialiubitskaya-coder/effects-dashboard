<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Fairy Dust · Digital Evolution Italy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Courier New',monospace;cursor:none;background:#05081a}

canvas{position:fixed;inset:0;z-index:0}

.ui{
  position:fixed;inset:0;z-index:10;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;
}
.ui-pre{font-size:.44rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(245,230,160,.9)}
.ui-title{
  font-family:Georgia,serif;font-weight:300;font-size:clamp(2.2rem,5.5vw,4.5rem);
  line-height:1;text-align:center;color:rgba(245,230,160,.9);
}
.ui-title em{font-style:italic;color:#c9a961}
.ui-line{width:36px;height:1px;background:#c9a961}
.ui-sub{font-size:.56rem;letter-spacing:.1em;text-align:center;
  max-width:380px;line-height:1.8;color:rgba(245,230,160,.55)}

.nav{position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
  padding:1.2rem 2rem;display:flex;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,.45),transparent)}
.logo-a{font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,230,160,.8)}
.logo-b{font-size:.44rem;letter-spacing:.28em;text-transform:uppercase;opacity:.5;color:rgba(245,230,160,.8)}

#dot{
  position:fixed;z-index:100;pointer-events:none;
  width:12px;height:12px;border-radius:50%;
  background:transparent;
  border:1.5px solid rgba(201,169,97,.8);
  box-shadow:0 0 10px rgba(201,169,97,.5);
  transform:translate(-50%,-50%);
}

.tag{position:fixed;bottom:1.5rem;right:1.5rem;z-index:20;font-size:.42rem;
  letter-spacing:.14em;text-transform:uppercase;
  border:1px solid rgba(255,255,255,.12);padding:.26rem .52rem;
  background:rgba(0,0,0,.5);backdrop-filter:blur(8px);color:rgba(245,230,160,.8)}
.tag span{color:#c9a961}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="dot"></div>

<nav class="nav">
  <div>
    <p class="logo-a">Digital Evolution</p>
    <p class="logo-b">Italy · Fairy Dust</p>
  </div>
</nav>

<div class="ui">
  <p class="ui-pre">Esperienza esclusiva</p>
  <h1 class="ui-title">Ogni dettaglio<br>è <em>oro.</em></h1>
  <div class="ui-line"></div>
  <p class="ui-sub">Polvere dorata per hotel di lusso e brand premium.</p>
</div>

<div class="tag">Effetto: <span>Fairy Dust</span> · Digital Evolution Italy</div>

<script>
const canvas = document.getElementById('c')
const ctx    = canvas.getContext('2d')
const dot    = document.getElementById('dot')

let W, H
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight }
resize(); window.addEventListener('resize', resize)

let mx = W/2, my = H/2, pmx = mx, pmy = my
let frameCount = 0
let particles = []

const GOLDS = ['#c9a961','#f5e6a3','#fff8d4','#e8c96a','#fffbe8']

document.addEventListener('mousemove', e => {
  mx = e.clientX; my = e.clientY
  dot.style.left = mx + 'px'
  dot.style.top  = my + 'px'
})

// Touch: drive the SAME effect at the finger position (mobile). Additive — desktop untouched.
function touchMove(e){
  const t = e.touches[0]; if (!t) return
  mx = t.clientX; my = t.clientY
  dot.style.left = mx + 'px'
  dot.style.top  = my + 'px'
}
document.addEventListener('touchstart', e => {
  const t = e.touches[0]; if (!t) return
  mx = t.clientX; my = t.clientY
  // start from finger so the first frame doesn't draw a streak from the old point
  pmx = mx; pmy = my
  dot.style.left = mx + 'px'
  dot.style.top  = my + 'px'
  e.preventDefault()
}, { passive:false })
document.addEventListener('touchmove', e => {
  touchMove(e)
  e.preventDefault()
}, { passive:false })

function drawStar(ctx, cx, cy, spikes, ro, ri){
  let rot = Math.PI/2*3, step = Math.PI/spikes
  ctx.beginPath(); ctx.moveTo(cx, cy-ro)
  for(let i=0;i<spikes;i++){
    ctx.lineTo(cx+Math.cos(rot)*ro, cy+Math.sin(rot)*ro); rot+=step
    ctx.lineTo(cx+Math.cos(rot)*ri, cy+Math.sin(rot)*ri); rot+=step
  }
  ctx.lineTo(cx, cy-ro); ctx.closePath()
}

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y
    const angle = Math.random()*Math.PI*2
    const spd   = Math.random()*1.7 + 0.5
    this.vx = Math.cos(angle)*spd
    this.vy = Math.sin(angle)*spd
    this.size  = Math.random()*2.4 + 0.8
    this.alpha = Math.random()*0.8 + 0.2
    this.decay = Math.random()*0.018 + 0.012
    this.drag  = 0.965
    this.grav  = 0.04
    this.color = GOLDS[Math.floor(Math.random()*GOLDS.length)]
    this.shape = Math.random() > .5 ? 'star' : 'circle'
    this.rot   = Math.random()*Math.PI*2
  }
  update(){
    this.x += this.vx; this.y += this.vy
    this.vx *= this.drag; this.vy *= this.drag
    this.vy += this.grav
    this.alpha -= this.decay
    this.size  *= 0.993
  }
  draw(){
    if (this.alpha<=0||this.size<=.2) return
    ctx.save()
    ctx.globalAlpha = Math.max(0, this.alpha)
    ctx.fillStyle   = this.color
    ctx.shadowColor = 'rgba(255,220,100,.8)'
    ctx.shadowBlur  = 10
    if (this.shape === 'star') {
      ctx.translate(this.x, this.y)
      ctx.rotate(frameCount*.05)
      drawStar(ctx, 0, 0, 4, this.size, this.size*.45)
      ctx.fillStyle = this.color
      ctx.fill()
    } else {
      ctx.beginPath()
      ctx.arc(this.x, this.y, Math.max(.1,this.size), 0, Math.PI*2)
      ctx.fill()
    }
    ctx.restore()
  }
  dead(){ return this.alpha<=0 || this.size<=.2 }
}

function loop(){
  requestAnimationFrame(loop)
  frameCount++

  ctx.fillStyle = 'rgba(5,8,20,0.2)'
  ctx.fillRect(0,0,W,H)

  const spd   = Math.hypot(mx-pmx, my-pmy)
  const count = Math.min(Math.ceil(spd*1.2)+1, 16)
  for (let i=0; i<count; i++){
    const t = i/Math.max(count,1)
    particles.push(new Particle(pmx+(mx-pmx)*t, pmy+(my-pmy)*t))
  }
  if (frameCount%3===0 && spd<1) particles.push(new Particle(mx,my))

  particles = particles.filter(p => { p.update(); p.draw(); return !p.dead() })
  pmx=mx; pmy=my
}

loop()
</script>
</body>
</html>
